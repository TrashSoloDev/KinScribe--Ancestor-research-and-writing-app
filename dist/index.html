    <script>
      // Vite HMR is disabled in AI Studio cloud preview environment.
      // Intercept 'vite-hmr' WebSocket to satisfy Vite client and eliminate connection errors.
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        function MockHmrSocket() {
          this.readyState = 1; // WebSocket.OPEN
          this.OPEN = 1;
          this.CONNECTING = 0;
          this.CLOSING = 2;
          this.CLOSED = 3;
          this._listeners = {};
        }
        MockHmrSocket.prototype.send = function() {};
        MockHmrSocket.prototype.close = function() {};
        MockHmrSocket.prototype.addEventListener = function(event, callback) {
          if (!this._listeners[event]) this._listeners[event] = [];
          this._listeners[event].push(callback);
          if (event === 'open') {
            setTimeout(function() {
              try { callback(new Event('open')); } catch (e) {}
            }, 0);
          }
        };
        MockHmrSocket.prototype.removeEventListener = function(event, callback) {
          if (!this._listeners[event]) return;
          this._listeners[event] = this._listeners[event].filter(function(cb) { return cb !== callback; });
        };
        MockHmrSocket.prototype.dispatchEvent = function() { return true; };

        window.WebSocket = function(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite')))) {
            return new MockHmrSocket();
          }
          return new OriginalWebSocket(url, protocols);
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        // Catch any transient unhandled error or rejection
        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) {
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (String(event.reason.message || event.reason).includes('WebSocket'))) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') event.preventDefault();
          }
        });
      })();
    </script>
